<!doctype html>
<html lang="nl">
  <head>
    <title>Task card example</title>
    <!-- global -->
    <link rel="stylesheet" href="https://unpkg.com/@utrecht/document-css@1.5.0/dist/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@gemeentenijmegen/design-tokens@latest/dist/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@gemeentenijmegen/font@latest/dist/index.css" />
    <!-- component specific -->
    <link rel="stylesheet" href="https://unpkg.com/@gemeentenijmegen/components-css@latest/dist/index.min.css" />
  </head>

  <body class="utrecht-document nijmegen-theme">
    <a class="nijmegen-task-navigation" href="#example">
      <div class="nijmegen-task-navigation__content">
        <strong>Task</strong>
      </div>
      <div class="nijmegen-task-navigation__context">
        <div class="nijmegen-task-navigation__details">
          <div class="nijmegen-task-navigation__date">
            <time datetime=""></time>
          </div>
        </div>
        <div class="nijmegen-task-navigation__actions">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="tabler-icon tabler-icon-arrow-right"
          >
            <path d="M5 12l14 0"></path>
            <path d="M13 18l6 -6"></path>
            <path d="M13 6l6 6"></path>
          </svg>
        </div>
      </div>
    </a>
  </body>
</html>
