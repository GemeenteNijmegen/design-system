<!doctype html>
<html lang="nl">
  <head>
    <title>Feature block example</title>
    <!-- global -->
    <link rel="stylesheet" href="https://unpkg.com/@utrecht/document-css@1.5.0/dist/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@gemeentenijmegen/design-tokens@latest/dist/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@gemeentenijmegen/font@latest/dist/index.css" />
    <!-- component specific -->
    <link rel="stylesheet" href="https://unpkg.com/@gemeentenijmegen/components-css@latest/dist/index.min.css" />
  </head>

  <body class="utrecht-document nijmegen-theme">
    <div class="nijmegen-feature-block">
      <div class="nijmegen-feature-block__container">
        <div class="nijmegen-feature-block__content">
          <div class="nijmegen-feature-block__message">
            <hgroup class="utrecht-heading-group">
              <p class="utrecht-pre-heading">Pre-heading</p>
              <h2 class="utrecht-heading-2">Heading</h2>
            </hgroup>
            <p class="utrecht-paragraph">Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod</p>
          </div>
          <a class="utrecht-button utrecht-button--primary-action" href="#"> Button </a>
        </div>
        <figure class="nijmegen-feature-block__figure">
          <img loading="lazy" src="https://picsum.photos/640/360/" alt="Placeholder image" />
        </figure>
      </div>
    </div>
  </body>
</html>
